name: 週末3CARDS 週指定・成績集計再実行
on:
  push:
    paths:
      - '.github/workflows/manual_week_results_backfill.yml'
  workflow_dispatch:
    inputs:
      week_id:
        description: 'ISO week to settle (e.g. 2026-W42)'
        required: true
        default: '2026-W42'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical week-results workflow without wall-clock date guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.week_id || '2026-W42' }}
        run: |
          gh workflow run run_results.yml --repo "$REPO" --ref main -f "week_id=$WEEK" -f refetch=false
          echo "Requested run_results.yml for $WEEK; verify the dispatched workflow result separately."
