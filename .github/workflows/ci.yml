name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: UI adapter tests
        run: node tests/test_adapter.js

      - name: Chat Chappy decision logs（構造と規約の検証）
        # 発走前性（Gitの初回コミット時刻）は run_results で全履歴を取って検証する。
        # ここではスキーマ・候補馬の網羅・落とした理由の必須化などの規約だけを確かめる。
        run: python -m research.decision_log validate
