name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: UI adapter tests
        run: node tests/test_adapter.js


      - name: Scratch settle 2026-09-26 results
        if: github.ref == 'refs/heads/chatgpt/results-ui-20260926'
        run: |
          python -m results.fetch_week_results --week 2026-W39 --refetch
          if [ -f data/race_results.json ]; then
            python -m results.build_results --results data/race_results.json
            python -m results.anomaly_review --results data/results.json --output data/research/anomaly_report.json || true
            python -m results.build_shadow_results --results data/race_results.json --champion-results data/results.json || true
          fi
          git config user.name "weekend3cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "auto: 2026-W39 live result settlement"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
