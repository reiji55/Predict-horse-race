name: 週末3CARDS 京都7番の戦績再取得（監査のみ）
on:
  push:
    paths:
      - ".github/workflows/reacquire_20261012_kyoto7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reacquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Re-fetch Neo Tokio only; leave raw and frozen snapshot unchanged
        run: |
          python - <<'PY'
          import datetime, json
          from pathlib import Path
          from scraper.fetchers import c2_shutuba_past, c_horse_history
          JST = datetime.timezone(datetime.timedelta(hours=9))
          raw = json.loads(Path("raw/2026-W42.json").read_text())
          race = next(r for r in raw["races"] if r["id"] == "20261012-kyoto-11")
          e = next(x for x in race["entries"] if x["num"] == 7)
          ref = e["horse_ref"]["netkeiba"]
          old = e["past_runs"]
          out = {"race_id":race["id"],"num":7,"name":e["name"],"horse_ref":ref,
                 "fetched_at":datetime.datetime.now(JST).isoformat(timespec="seconds"),
                 "old_count":len(old), "old_same_surface_count":sum(x.get("surface")=="芝" for x in old),
                 "current_score_explanation":"直近5走はダートのみ。人的統計のstartsもnull。現行Winスコア全因子欠損となりmarksから外れる。",
                 "frozen_snapshot_unchanged":True}
          try:
              lookup=c2_shutuba_past.fetch_shutuba_past(race["source_refs"]["netkeiba"], n_runs=5)
              found=lookup.get(ref)
              out["c2"]={"status":"ok" if found else "missing",
                         "count":len(found.get("past_runs",[])) if found else 0,
                         "same_as_raw":(found.get("past_runs")==old) if found else None,
                         "runs":found.get("past_runs",[]) if found else []}
          except Exception as exc:
              out["c2"]={"status":"error","error_type":type(exc).__name__}
          try:
              full=c_horse_history.fetch_horse_history_for_research(ref, n_runs=None)
              out["full_history"]={"status":full.get("status"),"retrieval":full.get("retrieval"),
                                   "source_total_rows":full.get("source_total_rows"),
                                   "runs_count":len(full.get("runs",[])),
                                   "turf_runs":[x for x in full.get("runs",[]) if x.get("surface")=="芝"],
                                   "diagnostics":full.get("diagnostics"),
                                   "ajax_diagnostics":full.get("ajax_diagnostics")}
          except Exception as exc:
              out["full_history"]={"status":"error","error_type":type(exc).__name__}
          if (out.get("c2") or {}).get("status")=="error" and (out.get("full_history") or {}).get("status") in ("error","blocked","fetch_failed"):
              print("Both live paths failed; retain original fact-based raw")
          target=Path("data/research/reacquire_20261012_kyoto_7.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print("REACQUIRE",json.dumps({k:v for k,v in out.items() if k not in ("c2","full_history")},ensure_ascii=False))
          print("C2",json.dumps({k:v for k,v in out.get("c2",{}).items() if k!="runs"},ensure_ascii=False))
          print("FULL",json.dumps({k:v for k,v in out.get("full_history",{}).items() if k not in ("turf_runs","diagnostics","ajax_diagnostics")},ensure_ascii=False))
          PY
      - name: Commit audit evidence only (no changes to frozen prediction)
        run: |
          git config user.name weekend3cards-bot
          git config user.email actions@users.noreply.github.com
          git add data/research/reacquire_20261012_kyoto_7.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: 2026-10-12 京都11R ネオトキオの単独再取得"
            for i in 1 2 3; do
              git push && exit 0
              sleep $((i * 4))
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi
