name: 検証用の取得（push で起動・作業ブランチ専用）

on:
  push:
    branches: ['claude/verify-*']
    paths: ['picks/verify_request.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - name: 取得
        run: |
          D=$(head -1 picks/verify_request.txt | tr -d '[:space:]')
          case "$D" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo bad; exit 1 ;; esac
          if [ "$(sed -n 2p picks/verify_request.txt | tr -d "[:space:]")" = payout ]; then python -m picks.fetch_payout --date "$D"; else python -m picks.fetch_verify --date "$D"; fi
      - name: コミット
        if: always()
        run: |
          git config user.name "weekend3cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/picks/verify/ || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: 検証用の取得（verify）"
          git push
