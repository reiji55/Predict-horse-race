name: 週末3CARDS 成績集計

# レースが終わったあとに走らせて、結果と払戻を取り込み data/results.json を作る。
# **後方検証（係数のチューニング）のデータはここでしか溜まらない。**
# 予想だけ回して成績集計を回さないと、いつまで経っても振り返りの材料が揃わない。

on:
  # 土日の夜に自動実行。GitHub Actionsの毎時0分付近の混雑を避け、10:17 UTC = 19:17 JSTに実行。
  schedule:
    - cron: '17 10 * * 6,0'
  workflow_dispatch:
    inputs:
      week_id:
        description: 'ISO週識別子 例: 2026-W38（空なら今日から自動判定）'
        required: false
      refetch:
        description: '取得済みのレースも取り直す（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # チャットChappy decision log の発走前性を、Git履歴（初回コミット時刻）で検証するため全履歴を取る
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存インストール
        run: pip install -r requirements-dev.txt

      # netkeibaを叩く前に落とす（無駄なリクエストを投げないため）
      - name: テスト
        run: |
          python -m pytest tests/test_build_results.py tests/test_build_shadow_results.py tests/test_fetch_week_results.py tests/test_model_compare.py tests/test_model_registry.py tests/test_anomaly_review.py tests/test_audit_manifest.py tests/test_shadow_research.py tests/test_forward_diagnostics.py tests/test_speed_v2_challenger.py tests/test_model_evaluation.py tests/test_race_performance.py tests/test_race_performance_evaluation.py tests/test_chat_experiment.py tests/test_market_audit.py tests/test_market_baseline.py tests/test_market_mix.py tests/test_portfolio.py -q

      - name: 対象の週を決める
        id: target
        run: |
          WEEK="${{ github.event.inputs.week_id }}"
          if [ -z "$WEEK" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # Scheduled runs can be delayed by GitHub Actions and cross JST midnight.
              # Use a 12-hour lookback so the Sunday results job still targets that weekend's ISO week.
              WEEK=$(TZ=Asia/Tokyo date -d '12 hours ago' +%G-W%V)
            else
              WEEK=$(TZ=Asia/Tokyo date +%G-W%V)
            fi
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "対象: week=$WEEK"

      - name: レース結果の取得（Fページ）
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          if [ ! -f "raw/${WEEK}.json" ]; then
            echo "raw/${WEEK}.json が無いので何もしません（先に予想パイプラインを回してください）"
            exit 0
          fi
          FLAG=""
          [ "${{ github.event.inputs.refetch }}" = "true" ] && FLAG="--refetch"
          python -m results.fetch_week_results --week "${WEEK}" $FLAG

      - name: results.json ビルド
        run: |
          # 採点するのは data/snapshots/（発走前に凍結した予想）。
          # data/predictions.json は毎回上書きされるので、ここで渡してはいけない。
          if [ -f data/race_results.json ] && [ -d data/snapshots ]; then
            python -m results.build_results --results data/race_results.json
          else
            echo "結果か発走前スナップショットがまだ無いためスキップします"
          fi

      - name: 想定外好走馬を研究キューへ追加
        # 研究用の派生ファイル。失敗しても成績集計・Challenger採点は止めない。
        continue-on-error: true
        run: |
          if [ -f data/results.json ]; then
            python -m results.anomaly_review \
              --results data/results.json \
              --output data/research/anomaly_report.json
          else
            echo "Champion結果が無いため研究キュー生成をスキップします"
          fi

      - name: Challengerも同じ結果で採点
        run: |
          if [ -f data/race_results.json ] && [ -f data/results.json ]; then
            python -m results.build_shadow_results \
              --results data/race_results.json \
              --champion-results data/results.json
          else
            echo "Champion結果が無いためChallenger比較をスキップします"
          fi

      - name: shadow研究の採点と累積（observe-only）
        # data/shadow/ にだけ書く。正式成績(data/results.json)・UIには混ぜない。失敗しても止めない。
        continue-on-error: true
        run: |
          if [ -f data/race_results.json ]; then
            python -m research.settle --results data/race_results.json
          else
            echo "結果がまだ無いため shadow 採点をスキップします"
          fi

      - name: チャット実験の採点（observe-only）
        # チャットで作った実験ロジック（data/chat_experiments/）の発走前の記録を、Git のコミット時刻・ルールの不変・
        # 見た snapshot の版で検証してから、同じ版の現行カードと並べて採点する（docs/research/CHAT_EXPERIMENTS.md）。
        # data/shadow/chat_experiments/ にだけ書く。正式成績・UI・予想には混ぜない。失敗しても止めない。
        continue-on-error: true
        run: |
          if [ -f data/race_results.json ] && [ -d data/chat_experiments ]; then
            python -m research.chat_experiment settle --results data/race_results.json
          else
            echo "結果か実験の記録がまだ無いため、チャット実験の採点をスキップします"
          fi

      - name: 発走前の市場オッズ監査（observe-only）
        # raw を「発走前に snapshot を最後に更新したコミット」に固定して、3連複オッズの時点・カバー率と、
        # 各カード・scenario-frame の券の依存度（露出・主軸が飛んだときの残り券・近似確率）を記録する（Issue #38 A / #39 PR-A）。
        # data/research/market_audit/ にだけ書く。予想・正式成績・UI には使わない。失敗しても止めない。
        continue-on-error: true
        run: python -m research.market_audit

      - name: 市場だけの確率の基準線（observe-only）
        # 発走前に固定したオッズ（時点が pre_race_verified のレースだけ）から、3連複の市場分布・Harville・
        # discounted Harville を作り、3連複 log loss・3着内 Brier を測る（Issue #39 PR-B）。
        # data/research/market_baseline/ にだけ書く。予想・正式成績・UI には使わない。失敗しても止めない。
        continue-on-error: true
        run: python -m research.market_baseline

      - name: 3連複ポートフォリオ層（observe-only）
        # 同じ市場の確率の上で、3連複5点の組み方を制約（露出上限・軸 X 抜きの最低数）あり／なしで比べ、的中確率・
        # X が外れたときの条件付き的中確率・露出を測る（Issue #39 PR-D）。scenario-frame/v1 の券も同じ確率で測る。
        # data/research/portfolio/ にだけ書く。予想・正式成績・UI には使わない。失敗しても止めない。
        continue-on-error: true
        run: python -m research.portfolio

      - name: forward diagnostics（observe-only）
        # 失敗段階の監査（疑似コンセンサス・recall@4/@6・conversion loss・Chappy段階）。
        # data/shadow/diagnostics* にだけ書く。予想pipelineはこの出力を読まない。
        # 失敗しても成績集計は止めないが、失敗したレースはrace_idと理由をログに出し、終了コード1にする。
        continue-on-error: true
        run: |
          if [ -f data/race_results.json ]; then
            python -m research.forward_diagnostics --results data/race_results.json
          else
            echo "結果がまだ無いため diagnostics をスキップします"
          fi

      - name: speed-v2 forward評価（evaluation-only）
        # Champion と speed-v2 Challenger を同じレース・同じ発走前情報で対にして比べる（事前登録した評価式）。
        # data/shadow/model_evaluation/ にだけ書く。正式成績・UI には混ぜない。失敗しても止めない。
        continue-on-error: true
        run: |
          if [ -f data/race_results.json ]; then
            python -m research.model_evaluation evaluate --results data/race_results.json
          else
            echo "結果がまだ無いため speed-v2 評価をスキップします"
          fi

      - name: race-performance-v1 forward評価（evaluation-only）
        # 事前登録（docs/research/RACE_PERFORMANCE_PREREG_V1.md §7）の評価式で、Champion と race-performance-v1
        # Challenger を同じレース・同じ発走前入力で対にして比べる。主指標は paired log loss、主要な副指標は Brier。
        # 開催日単位の bootstrap・40レースの点検・必ず併記する coverage・§12 の監査項目は集計の設定ファイルで出す。
        # data/shadow/model_evaluation/race-performance-v1/ にだけ書く。正式成績・UI には混ぜない。失敗しても止めない。
        # 上の「Challengerも同じ結果で採点」（全 Challenger 共通の shadow 採点・ROI）とは別物で、報告でも分けて扱う。
        continue-on-error: true
        run: |
          if [ -f data/race_results.json ]; then
            python -m research.model_evaluation evaluate --results data/race_results.json \
              --config config/model_evaluation_race_performance_v1.json \
              --summary-config config/model_evaluation_race_performance_v1_summary.json
          else
            echo "結果がまだ無いため race-performance-v1 評価をスキップします"
          fi

      - name: 生成物をコミット
        run: |
          git config user.name "weekend3cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "auto: ${{ steps.target.outputs.week }} 成績集計"
          # 直前オッズ観測・通常pipelineも同じブランチへpushする（向こうは新規ファイルの追加が中心）。
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - name: 市場＋能力モデルの混合 market-mix-v1 の評価（observe-only）
        id: market_mix
        # 事前登録（docs/research/MARKET_MIX_PREREG_V1.md）どおりに、開催日ごとの walk-forward で a・b・w を当てはめ、
        # 登録後のレースで 3連複 log loss を市場と比べる（Issue #39 PR-C2）。結果・p_model はコミット済みの版を読むので、
        # 今回の生成物をコミットした後に走らせる。data/research/market_mix/ にだけ書く。予想・正式成績・UI には使わない。
        # 仕様の不一致・確定した判定との不一致・レースの失敗は終了コード 1（出力はコミットしてから失敗にする）。
        # 失敗しても成績集計は止めないが、次のステップで警告を出す。
        continue-on-error: true
        run: |
          set +e
          python -m research.market_mix
          rc=$?
          set -e
          git add data/research/market_mix/
          if ! git diff --cached --quiet; then
            git commit -m "auto: ${{ steps.target.outputs.week }} market-mix-v1 評価"
            pushed=0
            for i in 1 2 3 4; do
              if git push; then pushed=1; break; fi
              sleep $((i * 5))
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            [ "$pushed" = 1 ] || exit 1
          fi
          exit $rc

      - name: market-mix-v1 の失敗を知らせる
        # continue-on-error のステップは失敗してもジョブが緑になるので、失敗を成功と見誤らないよう警告に出す
        if: steps.market_mix.outcome == 'failure'
        run: |
          echo "::warning title=market-mix-v1::評価が失敗、または警告で終了しました（data/research/market_mix/summary.json の status・warnings を確認）"
          echo "### ⚠️ market-mix-v1 の評価が失敗、または警告で終了しました" >> "$GITHUB_STEP_SUMMARY"
          echo "data/research/market_mix/summary.json の status・warnings を確認してください。" >> "$GITHUB_STEP_SUMMARY"
