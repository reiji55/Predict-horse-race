name: TEMP reacquire base_times v2 source

on:
  push:
    branches:
      - claude/content-review-full-rw32o2
    paths:
      - '.github/workflows/temp_reacquire_base_times_v2.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/content-review-full-rw32o2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Reacquire source records with fixed parser
        run: python -m scripts.acquire_base_times_v2 --start-year 2023 --end-year 2026

      - name: Verify fixed-parser source
        shell: bash
        run: |
          set -euo pipefail
          FINAL="data/reference/base_times/sources/netkeiba-race-search-2023-2026.records.json"
          PARTIAL="data/reference/base_times/sources/netkeiba-race-search-2023-2026.records.partial.json"
          test -f "$FINAL"
          test ! -e "$PARTIAL"
          python - <<'PY'
          import json
          p="data/reference/base_times/sources/netkeiba-race-search-2023-2026.records.json"
          with open(p, encoding="utf-8") as f:
              d=json.load(f)
          planned=d.get("planned_courses") or []
          courses=d.get("courses") or {}
          records=d.get("records") or []
          if len(planned) != 101 or len(courses) != 101:
              raise SystemExit(f"incomplete: planned={len(planned)} courses={len(courses)}")
          nulls=[r for r in records if r.get("class") is None]
          if nulls:
              raise SystemExit(f"class null remains: {nulls}")
          expected=[
              ("2023-04-30","京都","芝",3200),
              ("2023-10-29","東京","芝",2000),
              ("2024-04-28","京都","芝",3200),
              ("2024-10-27","東京","芝",2000),
              ("2025-05-04","京都","芝",3200),
              ("2025-11-02","東京","芝",2000),
              ("2026-05-03","京都","芝",3200),
          ]
          idx={(r.get("date"),r.get("venue"),r.get("surface"),r.get("dist")):r for r in records}
          for key in expected:
              r=idx.get(key)
              if not r:
                  raise SystemExit(f"expected Tianhuangsho record missing: {key}")
              if r.get("class")!="g1":
                  raise SystemExit(f"expected g1 but got {r.get('class')}: {key}")
          print("records", len(records))
          print("empty_courses", sum(1 for x in courses.values() if x.get("empty")))
          print("records_sha256", d.get("records_sha256"))
          print("tenno_sho_g1_check", "ok")
          PY

      - name: Commit complete source only
        shell: bash
        run: |
          set -euo pipefail
          FINAL="data/reference/base_times/sources/netkeiba-race-search-2023-2026.records.json"
          git config user.name "base-times-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FINAL"
          git diff --cached --quiet && exit 0
          git commit -m "data(reference): reacquire base-times v2 source with fixed class parser"
          git push origin HEAD:claude/content-review-full-rw32o2
