name: ChatGPT speed guard CI

on:
  push:
    branches:
      - chatgpt/fix-speed-coverage-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full Python tests
        run: python -m pytest -q
      - name: Node adapter tests
        run: node tests/test_adapter.js
      - name: Offline W38 speed-quality diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from logic import build_predictions

          raw = json.loads(Path("raw/2026-W38.json").read_text(encoding="utf-8"))
          pred = build_predictions.build_predictions(raw)
          for race in pred["races"]:
              if race["id"] != "20260920-nakayama-11":
                  continue
              print("race:", race["name"])
              print("speed_quality:", race["speed_quality"])
              for mark in race["marks"]:
                  if mark["num"] in (1, 4, 8):
                      print("target:", mark)
          PY
