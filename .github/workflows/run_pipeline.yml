name: 週末3CARDS パイプライン

# 引き継ぎ書v3 §4「GitHub Actions（workflow_dispatch 手動トリガー）」
# 土日朝、スマホからRunボタンをポチする運用（引き継ぎ書v1 §6）

on:
  # 土日の朝に自動実行（UTC）。JSTは+9時間なので 01:00 UTC = 10:00 JST。
  # メインは15:30前後なので、朝に出しておいて昼過ぎにもう一度回すと
  # オッズが固まった状態の買い目が取れる（04:00 UTC = 13:00 JST）。
  schedule:
    - cron: '0 1 * * 6,0'
    - cron: '0 4 * * 6,0'
  workflow_dispatch:
    inputs:
      week_id:
        description: 'ISO週識別子 例: 2026-W38（空なら今日から自動判定）'
        required: false
      dates:
        description: '対象日（スペース区切り）例: 2026-09-19（空なら今日）'
        required: false

permissions:
  contents: write  # GITHUB_TOKEN でのpushに必要（デフォルトreadの環境がある）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存インストール
        # 本番予想パイプラインも pytest を正規のテスト入口にする。
        # requirements-dev.txt は requirements.txt を内包しているため、実行時依存も同時に入る。
        run: pip install -r requirements-dev.txt

      # netkeibaを叩く前に全テストを pytest で実行する。
      # 以前は一部を `python tests/xxx.py` で直接実行しており、
      # 「pytest CI は緑だが本番パイプラインだけ import 方式の違いで落ちる」
      # かつ「pytest fixture を使う重要テストが本番では実行されない」という二重契約になっていた。
      # 入口を pytest に一本化し、同じ契約で全回帰テストを必ず通す。
      - name: テスト
        run: python -m pytest -q

      # スケジュール実行では入力が無いので、実行日（JST）から自動で決める
      - name: 対象の週と日付を決める
        id: target
        run: |
          WEEK="${{ github.event.inputs.week_id }}"
          DATES="${{ github.event.inputs.dates }}"
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          [ -z "$DATES" ] && DATES="$TODAY"
          [ -z "$WEEK" ] && WEEK=$(TZ=Asia/Tokyo date +%G-W%V)
          echo "week=$WEEK"   >> "$GITHUB_OUTPUT"
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "対象: week=$WEEK dates=$DATES"

      - name: raw/{week_id}.json ビルド
        # A/B/B2/C/D/E すべて実装済み。リーディングの取得に失敗した場合は
        # jockey_stats / trainer_stats が null のまま入る（③が欠損扱いになるだけで止まらない）
        # 土日を別々に実行する運用（引き継ぎ書v6 §1）では、既存の raw にマージされる
        run: |
          python -m scraper.build_raw \
            --week "${{ steps.target.outputs.week }}" \
            --dates ${{ steps.target.outputs.dates }}

      - name: JRA馬場定量値を添付
        # observe-only。失敗しても本番の予想生成・コミットは止めない。
        continue-on-error: true
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          python -m scraper.capture_track_context \
            --raw "raw/${WEEK}.json" \
            --dates ${{ steps.target.outputs.dates }}

      - name: 単勝オッズ観測履歴を保存
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          python -m logic.odds_history \
            --raw "raw/${WEEK}.json" \
            --phase pipeline

      - name: predictions.json ビルド
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          if [ -f "raw/${WEEK}.json" ]; then
            python -m logic.build_predictions --week "${WEEK}"
          else
            echo "raw/${WEEK}.json が生成されませんでした"
            exit 1
          fi

      - name: 発走前contextを独立snapshotへ凍結
        # observe-only。失敗しても本番の予想生成・コミットは止めない。
        continue-on-error: true
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          python -m logic.refresh_context --week "${WEEK}" --phase pipeline

      - name: 発走前監査manifestを保存
        # Prediction / Context / Odds の同一発走前証跡をSHA-256付きで束ねる。
        # observe-only。失敗しても予想本体は止めない。
        continue-on-error: true
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          python -m logic.audit_manifest --week "${WEEK}" --phase pipeline

      - name: データ品質ゲート
        run: |
          WEEK="${{ steps.target.outputs.week }}"
          python -m logic.data_quality \
            --raw "raw/${WEEK}.json" \
            --predictions data/predictions.json \
            --output data/quality_report.json \
            --fail-on critical

      - name: 生成物をコミット
        run: |
          git config user.name "weekend3cards-bot"
          git config user.email "actions@users.noreply.github.com"
          # rawもコミット（後方検証＝重み再計算に past_runs 等の生データが必要）。
          # data/ には発走前スナップショット（data/snapshots/）も含まれる。**採点の根拠はこれ**
          git add raw/ data/
          git diff --cached --quiet || git commit -m "auto: ${{ steps.target.outputs.week }} 予想生成"
          # 直前オッズ観測workflow（run_late_odds.yml）も同じブランチへpushする。
          # 向こうが足すのは data/odds_history/ の新規ファイルだけなので rebase は衝突しない。
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
