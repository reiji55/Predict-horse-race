<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>週末3CARDS｜予想師と狙う妙味レース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3EE;
    --card:#FFFFFF;
    --ink:#1A241F;
    --ink-soft:#5A6660;
    --turf:#175A38;
    --turf-deep:#0E3B25;
    --red-pen:#D8332A;
    --gold:#B8860B;
    --legend:#8A6A12;
    --legend-bright:#D4AF37;
    --line:#DFE3D9;
    --radius:14px;
    --mincho:'Shippori Mincho', serif;
    --gothic:'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:var(--gothic);
    background:var(--paper);
    color:var(--ink);
    max-width:480px;margin:0 auto;
    min-height:100vh;padding-bottom:76px;
    line-height:1.55;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

  /* ===== ヘッダー ===== */
  .app-head{
    background:var(--turf-deep);color:#fff;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
    position:sticky;top:0;z-index:20;
  }
  .app-head .brand{
    font-family:var(--mincho);font-weight:800;font-size:1.05rem;letter-spacing:.14em;
    display:flex;align-items:baseline;gap:10px;
  }
  .app-head .brand small{font-family:var(--gothic);font-weight:500;font-size:.68rem;letter-spacing:.08em;opacity:.75}
  .app-head .weekband{
    margin-top:6px;font-size:.72rem;letter-spacing:.06em;opacity:.85;
    display:flex;justify-content:space-between;align-items:center;
  }
  .status-pill{
    font-size:.66rem;font-weight:700;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    padding:2px 10px;border-radius:999px;
  }
  .status-pill.fresh{background:#2E7D4F;border-color:#3C9A64}

  .screen{display:none;padding:16px 16px 24px;animation:fade .18s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== 妙味メーター ===== */
  .distort{
    display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:64px;
  }
  .distort .d-label{font-size:.56rem;font-weight:900;letter-spacing:.12em;color:var(--ink-soft)}
  .distort .d-bar{width:64px;height:6px;border-radius:999px;background:#E3E7DE;overflow:hidden}
  .distort .d-bar i{display:block;height:100%;border-radius:999px;background:#8CA894}
  .distort.hot .d-bar i{background:linear-gradient(90deg,#C23028,#E8762C)}
  .distort.legend .d-bar i{background:linear-gradient(90deg,#8A6A12,#D4AF37)}
  .distort .d-val{font-family:var(--mincho);font-weight:800;font-size:.82rem;line-height:1}
  .distort.hot .d-val{color:#C23028}
  .distort.legend .d-val{color:var(--legend)}

  /* ===== レース一覧 ===== */
  /* 開催日の見出し。「今日のレースがちゃんと入っている」が一目で分かることを優先し、
     日付を主役にして大きく出す（曜日はその脇に小さく添える）。 */
  .day-label{
    margin:22px 2px 10px;display:flex;align-items:baseline;gap:10px;
  }
  .day-label .dl-date{
    font-size:1.5rem;font-weight:900;letter-spacing:.02em;color:var(--ink);
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .day-label .dl-dow{
    font-size:.82rem;font-weight:800;letter-spacing:.14em;color:var(--ink-soft);
  }
  .day-label .dl-today{
    font-size:.68rem;font-weight:900;letter-spacing:.12em;
    color:#fff;background:var(--accent,#1b5e3a);
    padding:3px 8px;border-radius:999px;white-space:nowrap;
  }
  .day-label .dl-count{
    font-size:.74rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;
  }
  .day-label::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
  .race-item{
    width:100%;text-align:left;position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 1px 2px rgba(20,40,30,.05);
  }
  .race-item:active{transform:scale(.985)}
  .race-item.legendary{
    border:1.5px solid var(--legend-bright);
    background:linear-gradient(135deg,#FFFDF4,#FBF3D9);
    box-shadow:0 2px 10px rgba(180,140,30,.22);
  }
  .legend-flag{
    position:absolute;top:-9px;left:14px;
    background:linear-gradient(90deg,#8A6A12,#D4AF37);color:#fff;
    font-size:.6rem;font-weight:900;letter-spacing:.2em;
    padding:2px 10px;border-radius:999px;
    box-shadow:0 2px 6px rgba(140,110,20,.4);
  }
  .schedule-flag{
    position:absolute;top:-9px;left:14px;
    background:#5F7468;color:#fff;font-size:.6rem;font-weight:900;letter-spacing:.08em;
    padding:2px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(40,70,55,.22);
  }
  .schedule-mini{font-size:.68rem;font-weight:900;color:#5F7468;border:1px solid #A8B8AF;border-radius:999px;padding:4px 8px;white-space:nowrap}
  .scheduled-panel{background:#F5F8F6;border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;line-height:1.8}
  .scheduled-panel b{color:var(--turf)}
  .race-item .venue{
    font-family:var(--mincho);font-weight:800;font-size:.82rem;color:var(--turf);
    writing-mode:vertical-rl;letter-spacing:.3em;
    border-right:2px solid var(--turf);padding-right:8px;line-height:1;
    min-height:52px;display:flex;align-items:center;
  }
  .race-item.legendary .venue{color:var(--legend);border-color:var(--legend-bright)}
  .race-item .info{flex:1}
  .race-item .rname{
    font-family:var(--mincho);font-weight:800;font-size:1rem;letter-spacing:.03em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .grade{font-size:.6rem;font-weight:900;color:#fff;padding:1px 7px;border-radius:4px;letter-spacing:.05em}
  .grade.g1{background:#1A1A1A}
  .grade.g2{background:#153E8A}
  .grade.g3{background:#1E5AC8}
  .grade.cls{background:#7C8A80}
  .grade.op{background:#6B7280}
  .grade.mi{background:#8CA894}
  .race-item .meta{font-size:.7rem;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}

  .notice{
    margin-top:18px;font-size:.66rem;color:var(--ink-soft);
    border-top:1px dashed var(--line);padding-top:10px;line-height:1.7;
  }

  /* ===== レース詳細 ===== */
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.78rem;font-weight:700;color:var(--turf);padding:4px 2px;margin-bottom:8px;
  }
  .detail-head{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .detail-head::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--turf) 0%,#4C9A6C 100%);
  }
  .detail-head .rname{
    font-family:var(--mincho);font-weight:800;font-size:1.25rem;letter-spacing:.05em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .detail-head .cond{font-size:.72rem;color:var(--ink-soft);margin-top:4px;letter-spacing:.03em}
  .detail-head .d-inline{
    display:flex;align-items:center;gap:8px;margin-top:10px;
    font-size:.64rem;font-weight:900;color:var(--ink-soft);letter-spacing:.1em;
  }
  .detail-head .d-inline .d-bar{flex:1;height:7px;border-radius:999px;background:#E3E7DE;overflow:hidden}
  .detail-head .d-inline .d-bar i{display:block;height:100%}
  .detail-head .d-inline b{font-family:var(--mincho);font-size:.95rem}

  .marks-row{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .marks-row::-webkit-scrollbar{display:none}
  .mark-chip{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    min-width:44px;padding:6px 4px;border-radius:10px;background:var(--paper);
    /* 実馬名は6〜9文字あり、縮むと隣のチップと重なるので縮小させない（行は横スクロールする） */
    flex:0 0 auto;
  }
  .mark-chip .mk{font-family:var(--mincho);font-weight:800;font-size:1rem;line-height:1}
  .mark-chip .mk.hon{color:var(--red-pen)}
  .mark-chip .hname{
    font-size:.56rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;
    max-width:6.5em;overflow:hidden;text-overflow:ellipsis;   /* 長い馬名は…で省略 */
  }

  /* 確変バナー */
  .kakuhen{
    margin-bottom:14px;padding:12px 16px;border-radius:var(--radius);
    background:linear-gradient(120deg,#211A05,#4A3808 55%,#8A6A12);
    color:#F6E9C5;position:relative;overflow:hidden;
    border:1px solid var(--legend-bright);
  }
  .kakuhen::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,240,190,.35),transparent);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}55%,100%{left:130%}}
  @media (prefers-reduced-motion: reduce){
    .kakuhen::after{animation:none}
    .screen{animation:none}
  }
  .kakuhen .kk-tag{font-size:.6rem;font-weight:900;letter-spacing:.3em;color:var(--legend-bright)}
  .kakuhen .kk-msg{font-family:var(--mincho);font-weight:800;font-size:1.02rem;letter-spacing:.08em;margin-top:2px}
  .kakuhen .kk-sub{font-size:.66rem;opacity:.85;margin-top:3px}

  /* ===== 予想師カード ===== */
  .risk-card{
    background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
    margin-bottom:16px;overflow:hidden;box-shadow:0 2px 6px rgba(20,40,30,.06);
  }
  .rc-head{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;background:rgba(255,255,255,.2);
    border:2px solid rgba(255,255,255,.55);
  }
  .rc-who{flex:1;min-width:0}
  /* キャラ絵(img)が入った場合の共通スタイル。span版と同じ外形に揃える */
  .avatar-img{object-fit:cover;object-position:top center;padding:0 !important}
  .say-avatar.avatar-img{object-fit:cover;object-position:top center;padding:0 !important}
  .rc-who .nickname{font-size:.6rem;font-weight:900;letter-spacing:.15em;opacity:.85}
  .rc-who .cname{
    font-family:var(--mincho);font-weight:800;font-size:1.1rem;letter-spacing:.08em;line-height:1.3;
    display:flex;align-items:center;gap:8px;
  }
  .risk-tag{
    font-family:var(--gothic);font-size:.56rem;font-weight:900;letter-spacing:.1em;
    padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
  }
  .rc-hit{text-align:right;font-size:.58rem;font-weight:700;letter-spacing:.08em;opacity:.95;flex:none}
  .rc-hit b{display:block;font-family:var(--mincho);font-size:1.05rem}
  .risk-card.low .rc-head{background:linear-gradient(120deg,#175A38,#2E7D4F)}
  .risk-card.mid .rc-head{background:linear-gradient(120deg,#8A6508,#B8860B)}
  .risk-card.high .rc-head{background:linear-gradient(120deg,#8E1F18,#C23028)}
  .risk-card.chappy .rc-head{background:linear-gradient(120deg,#111827,#374151)}
  .risk-card.chappy{border-color:#AEB6C2;box-shadow:0 4px 14px rgba(17,24,39,.12)}
  .char-card.chappy .char-top .avatar{border-color:#374151}
  .chatgpt-mark{display:inline-flex;align-items:center;justify-content:center;color:currentColor}
  .chatgpt-mark svg{width:72%;height:72%;display:block}
  .risk-card.legend{
    border:1.5px solid var(--legend-bright);
    box-shadow:0 4px 18px rgba(180,140,30,.3);
  }
  .risk-card.legend .rc-head{
    background:linear-gradient(120deg,#1C1503,#4A3808 60%,#8A6A12);
    position:relative;overflow:hidden;
  }
  .risk-card.legend .rc-head::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,240,190,.3),transparent);
    animation:shine 3.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){.risk-card.legend .rc-head::after{animation:none}}
  .risk-card.legend .avatar{border-color:var(--legend-bright);background:rgba(212,175,55,.25)}

  .rc-range{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;border-bottom:1px solid var(--line);
    font-size:.7rem;color:var(--ink-soft);font-weight:700;letter-spacing:.05em;
  }
  .rc-range b{font-family:var(--mincho);font-size:1rem;color:var(--ink)}
  .risk-card.legend .rc-range{background:#FFFBEE}

  .uma{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:5px;
    font-size:.78rem;font-weight:900;line-height:1;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .w1{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px #999}
  .w2{background:#222;color:#fff}
  .w3{background:#DC2F2F;color:#fff}
  .w4{background:#1E5AC8;color:#fff}
  .w5{background:#F2C518;color:#111}
  .w6{background:#1D9E50;color:#fff}
  .w7{background:#E8762C;color:#fff}
  .w8{background:#F286A8;color:#111}

  .bet-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px dashed var(--line)}
  .bet-row:last-of-type{border-bottom:none}
  .bet-type{
    font-size:.66rem;font-weight:900;letter-spacing:.05em;
    padding:3px 8px;border-radius:5px;white-space:nowrap;
    background:var(--paper);color:var(--turf);border:1px solid var(--line);
  }
  .risk-card.legend .bet-type{color:var(--legend);background:#FFFBEE;border-color:#EBDDA8}
  .bet-horses{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-weight:900;font-size:.8rem;color:var(--ink-soft)}
  .bet-amt{font-family:var(--mincho);font-weight:800;font-size:.95rem;white-space:nowrap}

  .rc-total{
    display:flex;justify-content:flex-end;gap:10px;align-items:baseline;
    padding:8px 16px;background:var(--paper);
    font-size:.68rem;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;
  }
  .rc-total b{font-family:var(--mincho);font-size:1.05rem;color:var(--ink)}
  .risk-card.legend .rc-total{background:#FBF3D9}
  .risk-card.legend .rc-total b{color:var(--legend)}

  /* キャラのセリフ吹き出し */
  .rc-say{
    margin:14px 16px 16px;display:flex;gap:10px;align-items:flex-start;
  }
  .rc-say .say-avatar{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;
    background:var(--paper);border:1.5px solid var(--line);
  }
  .rc-say .bubble{
    position:relative;flex:1;
    background:#FBFBF8;border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;font-size:.78rem;line-height:1.75;
  }
  .rc-say .bubble::before{
    content:"";position:absolute;left:-6px;top:12px;
    width:10px;height:10px;background:#FBFBF8;
    border-left:1px solid var(--line);border-bottom:1px solid var(--line);
    transform:rotate(45deg);
  }
  .risk-card.legend .rc-say .bubble{background:#FFFBEE;border-color:#EBDDA8}
  .risk-card.legend .rc-say .bubble::before{background:#FFFBEE;border-color:#EBDDA8}

  /* ===== 予想師名鑑 ===== */
  .char-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .char-card.legend{
    border:1.5px solid var(--legend-bright);
    background:linear-gradient(150deg,#FFFDF4,#FBF3D9);
  }
  .char-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .char-top .avatar{border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.6rem;width:52px;height:52px}
  .char-card.low .char-top .avatar{border-color:#2E7D4F}
  .char-card.mid .char-top .avatar{border-color:#B8860B}
  .char-card.high .char-top .avatar{border-color:#C23028}
  .char-card.legend .char-top .avatar{border-color:var(--legend-bright)}
  .char-top .nickname{font-size:.62rem;font-weight:900;letter-spacing:.15em;color:var(--ink-soft)}
  .char-top .cname{font-family:var(--mincho);font-weight:800;font-size:1.2rem;letter-spacing:.08em}
  .char-bio{font-size:.76rem;line-height:1.8;color:var(--ink)}
  .char-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .char-tags span{
    font-size:.62rem;font-weight:900;letter-spacing:.05em;
    padding:3px 10px;border-radius:999px;background:var(--paper);
    border:1px solid var(--line);color:var(--ink-soft);
  }
  .char-card.legend .char-tags span{background:#FFF;border-color:#EBDDA8;color:var(--legend)}

  /* ===== 成績 ===== */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
  .stat-box .lbl{font-size:.64rem;font-weight:700;color:var(--ink-soft);letter-spacing:.15em}
  .stat-box .val{font-family:var(--mincho);font-weight:800;font-size:1.7rem;line-height:1.3}
  .stat-box .val.plus{color:var(--turf)}
  .stat-box .val.minus{color:var(--red-pen)}
  .stat-box .sub{font-size:.62rem;color:var(--ink-soft)}
  .sec-title{
    font-family:var(--mincho);font-weight:800;font-size:.95rem;letter-spacing:.15em;
    margin:20px 4px 10px;display:flex;align-items:center;gap:10px;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .cardstat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
  .cardstat.legend{border-color:var(--legend-bright);background:linear-gradient(150deg,#FFFDF4,#FBF3D9)}
  .cardstat .cs-head{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:900;margin-bottom:10px}
  .cardstat .cs-head .cs-ava{font-size:1.1rem}
  .cardstat .cs-head .cs-ava.avatar-img{width:22px;height:22px;border-radius:50%;flex:none}
  .cardstat .cs-head .cs-app{margin-left:auto;font-size:.6rem;color:var(--ink-soft);font-weight:700;letter-spacing:.05em}
  .dual{display:grid;grid-template-columns:30px 1fr 54px;align-items:center;gap:8px;margin-bottom:7px}
  .dual .d-lbl{font-size:.6rem;font-weight:900;letter-spacing:.15em;color:var(--ink-soft)}
  .dual .d-track{position:relative;height:9px;border-radius:999px;background:var(--paper)}
  .dual .d-track i{display:block;height:100%;border-radius:999px}
  .dual.roi .d-track::after{content:"";position:absolute;top:-3px;bottom:-3px;left:66.6%;border-left:2px dashed #C6CCC1}
  .dual.roi .d-track i{background:#98A49D}
  .dual.roi.plus .d-track i{background:linear-gradient(90deg,#8A6A12,#D4AF37)}
  .cardstat.low .dual.hit i{background:#2E7D4F}
  .cardstat.mid .dual.hit i{background:#B8860B}
  .cardstat.high .dual.hit i{background:#C23028}
  .cardstat.legend .dual.hit i{background:linear-gradient(90deg,#8A6A12,#D4AF37)}
  .dual .d-num{font-family:var(--mincho);font-weight:800;font-size:.9rem;text-align:right}
  .dual.roi.plus .d-num{color:var(--legend)}
  .cardstat .cs-foot{display:flex;justify-content:space-between;align-items:baseline;font-size:.62rem;color:var(--ink-soft);margin-top:9px;border-top:1px dashed var(--line);padding-top:7px}
  .cardstat .cs-foot b{font-family:var(--mincho);color:var(--ink);font-size:.85rem}
  .roi-note{font-size:.62rem;color:var(--ink-soft);margin:0 4px 10px;letter-spacing:.03em;line-height:1.7}

  .hist-item{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  }

/* 実データを読み込めたかどうか。読めていなければ画面に「サンプル」と明示する。
   ★ 予想(predictions.json)と成績(results.json)は**別ファイル・別のタイミングで揃う**ので、
   フラグも分けている。以前は1つのフラグを予想の読み込みで false にしていたため、
   成績がサンプルのままでも「サンプルです」の注記だけが消え、
   **架空の収支・的中率が実績のように表示されていた**（馬券アプリとして最悪の状態）。 */

let STATS_IS_SAMPLE = true;   // 成績

const statsNote = () => STATS_IS_SAMPLE ? "※ 表示はすべてサンプルデータです。" : "※ ";

// img(画像パス)が設定されていればそれを表示。Chappyは結び目系のインラインSVG。
// 外部CDNや商標アセットには依存しないため、オフライン/PWAでも表示できる。
const avatarHtml = (ch, cls) => ch.icon==="chatgpt"
  ? chatgptMark(cls)
  : ch.img
    ? `<img src="${ch.img}" alt="${ch.name}" class="${cls} avatar-img">`
    : `<span class="${cls}">${ch.ava}</span>`;
const horsesHtml = pairs => pairs.map(p=>umaChip(p[0],p[1])).join('<span style="opacity:.4">－</span>');
// データスキーマ仕様§1 races[].grade の全コードに対応（g1/g2 や 1〜3勝クラスが
// 「未勝利」バッジになってしまうのを防ぐ）。adapter.js の GRADE_LABEL と同じ表記に揃える。
const GRADE_BADGE = {
  g1:["g1","GⅠ"], g2:["g2","GⅡ"], g3:["g3","GⅢ"], op:["op","OP"],
  "3win":["cls","3勝"], "2win":["cls","2勝"], "1win":["cls","1勝"], mi:["mi","未勝利"],
};
const gradeBadge = g => {
  const badge = GRADE_BADGE[g];
  return badge ? `<span class="grade ${badge[0]}">${badge[1]}</span>` : "";
};
function distortHtml(v){
  const cls = v>=80 ? "legend" : v>=60 ? "hot" : "";
  return `<span class="distort ${cls}">
    <span class="d-label">妙味</span>
    <span class="d-bar"><i style="width:${v}%"></i></span>
    <span class="d-val">${v}</span>
  </span>`;
}

/* ================= レース一覧 ================= */
/* レースIDの先頭8桁(YYYYMMDD)が唯一の日付の出どころ。
   以前は「土なら7/4、日なら7/5」とサンプル時代の日付を直書きしていて、
   実データを表示しても見出しだけ 7/4 のままになっていた。 */
const DOW_JA = ["日","月","火","水","木","金","土"];

function ymdOf(race){
  return (race.id && race.id.length >= 8) ? race.id.slice(0,8) : null;
}

function dayHeading(ymd, count){
  const y = Number(ymd.slice(0,4)), m = Number(ymd.slice(4,6)), d = Number(ymd.slice(6,8));
  const dow = DOW_JA[new Date(y, m-1, d).getDay()];
  const today = new Date();
  const isToday = today.getFullYear()===y && today.getMonth()===m-1 && today.getDate()===d;
  return `<div class="day-label">
    <span class="dl-date">${m}月${d}日</span>
    <span class="dl-dow">${dow}曜</span>
    ${isToday ? '<span class="dl-today">本日</span>' : ''}
    <span class="dl-count">${count}レース</span>
  </div>`;
}

function renderList(){
  let html = "";
  const byDay = new Map();
  RACES.forEach(r=>{
    const ymd = ymdOf(r) || "";
    if(!byDay.has(ymd)) byDay.set(ymd, []);
    byDay.get(ymd).push(r);
  });

  [...byDay.keys()].sort((a,b)=>b.localeCompare(a)).forEach(ymd=>{
    const rs = byDay.get(ymd);
    if(!rs.length) return;
    html += ymd ? dayHeading(ymd, rs.length) : "";
    rs.forEach(r=>{
      html += `
      <button class="race-item ${r.legendary?'legendary':''}" onclick="goDetail('${r.id}')">
        ${r.status==='scheduled'?'<span class="schedule-flag">代替開催</span>':(r.legendary?'<span class="legend-flag">鳳 降臨</span>':'')}
        <span class="venue">${r.venue}</span>
        <span class="info">
          <span class="rname">${r.name} ${gradeBadge(r.grade)}</span>
          <span class="meta">${r.no}・${r.cond}・${r.time}発走</span>
        </span>
        ${r.status==='scheduled'?'<span class="schedule-mini">予想準備中</span>':distortHtml(r.distort)}
      </button>`;
    });
  });
  html += `<p class="notice">${sampleNote()}「妙味メーター」はオッズと当モデル評価の乖離(=期待値の旨み)を数値化した独自指標で、高いほどベット妙味が大きいレース。鳳が降臨するのは、80超に加えて<b>鳳が実際に買う馬券の実オッズで期待値がプラス</b>と確認できたときだけなので、80超でも降臨しないことがあります。予想は参考情報であり、購入判断はご自身の責任でお願いします。馬券の購入は20歳以上に限られます。</p>`;
  document.getElementById("scr-list").innerHTML = html;
}

    <div class="bet-row">
      <span class="bet-type">${b.type}</span>
      <span class="bet-horses">${horsesHtml(b.h)}</span>
      <span class="bet-amt">${b.amt}円</span>
    </div>`).join("");
  return `
  <article class="risk-card ${cls}">
    <div class="rc-head">
      ${avatarHtml(ch, "avatar")}

        <span class="nickname">${ch.nickname}</span>
        <span class="cname">${ch.name} <span class="risk-tag">${ch.risk}</span></span>

      <span class="rc-hit">${(c.char==="chappy"||c.char==="otori")?"参考的中率":"想定的中率"}<b>${c.hit}</b></span>

    <div class="rc-say">

      <span class="bubble">${c.say}</span>
    </div>
  </article>`;
}

    </div>` : ''}
    <div class="detail-head">
      <div class="rname">${r.name} ${gradeBadge(r.grade)}</div>
      <div class="cond">${r.venue}${r.no}・${r.cond}・${r.time}発走</div>
      <div class="d-inline">妙味メーター
        <span class="d-bar"><i style="width:${r.distort}%;background:${dcolor}"></i></span>
        <b>${r.distort}</b>
      </div>
      <div class="marks-row">${marks}</div>
    </div>
    ${r.cards.map(cardHtml).join("")}
    <p class="notice">${sampleNote()}想定的中率・払戻レンジはモデルの試算値であり、結果を保証するものではありません。</p>
  `;
}

/* ================= 予想師名鑑 ================= */
function renderChars(){
  const order = ["otori","chappy","kei","tetsu","gen"];
  const html = order.map(id=>{
    const c = CHARS[id];
    return `
    <div class="char-card ${c.cls}">
      <div class="char-top">
        ${avatarHtml(c, "avatar")}
        <span>
          <div class="nickname">${c.nickname}</div>
          <div class="cname">${c.name}</div>
        </span>
      </div>
      <p class="char-bio">${c.bio}</p>
      <div class="char-tags">${c.tags.map(t=>`<span>${t}</span>`).join("")}</div>
    </div>`;
  }).join("");
  document.getElementById("scr-chars").innerHTML = `
    <div class="sec-title" style="margin-top:4px">予想師名鑑</div>
    ${html}
    <p class="notice">※ ケイ・哲さん・源さんは固定ルールの予想師。チャッピーは複数シグナルを動的に統合する1000円枠で、高確信ゲート通過時は同じ枠が鳳へ昇格します。チャッピー/鳳の参考的中率は未校正モデルによる試算で、真の確率を保証するものではありません。</p>
  `;
}

/* ================= 成績 ================= */
function renderStats(){
  const cs = STATS.chars.map(s=>{
    const c = CHARS[s.id];
    const roiW = Math.min(s.roi/150*100, 100); // 回収率バーは150%スケール(点線=損益分岐100%)
    const plus = s.roi >= 100;
    return `
    <div class="cardstat ${c.cls}">
      <div class="cs-head">
        ${avatarHtml(c, "cs-ava")}<span>${c.name}</span>
        <span class="cs-app">${s.rec}</span>
      </div>
      <div class="dual hit">
        <span class="d-lbl">的中</span>
        <span class="d-track"><i style="width:${s.hit}%"></i></span>
        <span class="d-num">${s.hit}%</span>
      </div>
      <div class="dual roi ${plus?'plus':''}">
        <span class="d-lbl">回収</span>
        <span class="d-track"><i style="width:${roiW}%"></i></span>
        <span class="d-num">${s.roi}%</span>
      </div>
      <div class="cs-foot"><span>的中したときの平均払戻(500円あたり)</span><b>${s.avgPay}</b></div>
    </div>`;
  }).join("");
  // 予想は実データなのに成績がまだ無い状態。ここでサンプルを出すと嘘になるので、
  // 数字を一切出さずに「まだ無い」と正直に言う。
  if(STATS_IS_SAMPLE && !IS_SAMPLE){
    document.getElementById("scr-stats").innerHTML = `
      <div class="stat-grid">
        <div class="stat-box" style="grid-column:1/-1">
          <div class="lbl">累計成績</div>
          <div class="val" style="font-size:1.35rem">まだ集計できる結果がありません</div>
          <div class="sub">レースが終わると自動で結果と払戻を取り込み、ここに実績が積み上がります。</div>
        </div>
      </div>
      <p class="notice">※ 的中率・回収率は<b>実際のレース結果からのみ</b>集計します。
      レース画面に出ている「想定的中率」はモデルの試算値で、ここに出る実績とは別物です。</p>`;
    return;
  }

  const hist = STATS.history.map(h=>`
    <div class="hist-item" ${h.legend?'style="border-color:var(--legend-bright);background:linear-gradient(150deg,#FFFDF4,#FBF3D9)"':''}>
      <span class="hit-mark ${h.hit?'hit':'miss'}">${h.hit?'◯':'✕'}</span>
      <span class="h-info">
        <span class="h-name-row">
          <span class="h-name">${h.name}</span>
          ${h.top3 && h.top3.length ? `<span class="h-top3">${h.top3.map((p,i)=>`<span>${i+1}着 ${umaChip(p[0],p[1])}</span>`).join(" ・ ")}</span>` : ""}
        </span>
        <div class="h-meta">${h.meta}</div>
      </span>
      <span class="h-pay ${h.hit?'plus':''}">${h.pay}<small>収支</small></span>
    </div>`).join("");
  document.getElementById("scr-stats").innerHTML = `
    <div class="stat-grid">
      <div class="stat-box" style="grid-column:1/-1">
        <div class="lbl">累計収支 — 全予想師のカードを毎回すべて買った場合</div>
        <div class="val minus">${STATS.balance}</div>
        <div class="sub">購入${STATS.bought}・払戻${STATS.paid}・回収率${STATS.roi}・対象${STATS.races}レース</div>
      </div>
    </div>
    <div class="sec-title">予想師別 成績</div>
    <p class="roi-note">「回収」バーの点線は損益分岐点(100%)。点線を右に超えていればプラス収支です。バーの上限は150%で、それを超えた回収率は振り切って表示されます。</p>
    ${cs}
    <div class="sec-title">直近の結果</div>
    ${hist}
    <p class="notice">${statsNote()}レース結果から予想師別・券種別に自動集計しています。マイナス収支も隠さず表示します。</p>
  `;
}

/* ================= ナビゲーション ================= */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0});
}
function setNav(on){
  ["list","chars","stats"].forEach(k=>{
    document.getElementById("nav-"+k).classList.toggle("on", on===k);
  });
}
function goList(){ show("scr-list"); setNav("list"); }
function goChars(){ show("scr-chars"); setNav("chars"); }
function goStats(){ show("scr-stats"); setNav("stats"); }
function goDetail(id){
  renderDetail(RACES.find(x=>x.id===id));
  show("scr-detail"); setNav("list");
}

/* ================= 実データの読み込み =================
   GitHub Pages ではリポジトリ直下の data/ を読む（このファイルは docs/ui/ にあるので ../../data/）。
   file:// で直接開いた場合や、まだ predictions.json が生成されていない場合は fetch が失敗するので、
   上のサンプルデータがそのまま表示される（モックとしての単体動作を壊さない）。
   変換ロジックは adapter.js（tests/test_adapter.js でサンプルJSONに対して検証済み）。 */
const DATA_BASE = "../../data/";

async function loadJson(name){
  try{
    const res = await fetch(DATA_BASE + name, {cache:"no-store"});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;   // file:// や未生成のときはモックのまま動かす
  }
}

function setStatus(text, fresh){
  const pill = document.getElementById("updateStatus");
  if(!pill) return;
  pill.textContent = text;
  pill.classList.toggle("fresh", !!fresh);
}

/* レースIDの先頭8桁(YYYYMMDD)から「2026.7.4 — 7.5」のような見出しを作る */
function weekBandText(races){
  const days = races.map(r => (r.id && r.id.length >= 8) ? r.id.slice(0,8) : null).filter(Boolean);
  if(!days.length) return null;
  const md = d => `${Number(d.slice(4,6))}.${Number(d.slice(6,8))}`;
  const first = days.reduce((a,b) => a < b ? a : b);
  const last  = days.reduce((a,b) => a > b ? a : b);
  const head  = `${first.slice(0,4)}.${md(first)}`;
  return first === last ? head : `${head} — ${md(last)}`;
}

async function boot(){
  renderList(); renderChars(); renderStats();          // まずサンプルで描画

  const [predictions, comments, results] = await Promise.all([
    loadJson("predictions.json"), loadJson("comments.json"), loadJson("results.json"),
  ]);

  if(predictions && predictions.races && predictions.races.length){
    IS_SAMPLE = false;
    RACES = W3CAdapter.toRaces(predictions, comments || {});
    renderList();
    const band = document.getElementById("weekBand");
    const text = weekBandText(RACES);
    if(band && text) band.textContent = text;
    const generated = predictions.generated_at ? predictions.generated_at.slice(11,16) : null;
    setStatus(generated ? `${generated} 更新` : "更新済み", true);
  }else{
    setStatus("サンプル表示", false);
  }

  if(results && results.results && results.results.length){
    STATS_IS_SAMPLE = false;
    STATS = W3CAdapter.toStats(results, predictions || {});
  }
  renderStats();   // 成績が無い場合も、空状態に描き直すため必ず呼ぶ
}

boot();
</script>
